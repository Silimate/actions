name: Checkout
description: >
  actions/checkout with the Silimate defaults: full history (needed by setuptools-scm
  and by release metadata) and a deploy key for private submodules.

inputs:
  repository:
    description: Repository to check out.
    required: false
    default: ${{ github.repository }}
  ref:
    description: Ref to check out.
    required: false
    default: ""
  path:
    description: Directory to check out into, relative to the workspace.
    required: false
    default: ""
  fetch-depth:
    description: History depth. 0 (the default) is required by setuptools-scm and build metadata.
    required: false
    default: "0"
  submodules:
    description: "false, true, or recursive."
    required: false
    default: "false"
  ssh-key:
    description: >
      Deploy key used to fetch private submodules over SSH. Pass secrets.SSH_PRIVATE_KEY.
      Composite actions cannot read secrets directly, so it has to come in as an input.
    required: false
    default: ""
  token:
    description: Token used for HTTPS fetches when no ssh-key is given.
    required: false
    default: ${{ github.token }}
  trust-github-host-keys:
    description: Run ssh-keyscan for github.com first. Needed on self-hosted runners with an empty known_hosts.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Trust github.com SSH host keys
      if: inputs.trust-github-host-keys == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        # Pre-seeding known_hosts keeps submodule fetches from prompting
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
        sort -u -o ~/.ssh/known_hosts ~/.ssh/known_hosts

    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: ${{ inputs.submodules }}
        ssh-key: ${{ inputs.ssh-key }}
        token: ${{ inputs.token }}
